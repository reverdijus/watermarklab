name: sav
modality: video
description: >-
  SA-V (Segment Anything Video, Meta) : ~51 000 vidéos réelles variées (MP4, 24 fps,
  résolutions d'origine). Données d'entraînement vidéo utilisées par Video Seal.
  Téléchargement : formulaire sur la page officielle (archives sav_train/sav_000…).
source: "https://ai.meta.com/datasets/segment-anything-video/"
license: "CC BY 4.0 (vidéos et annotations)"
paths:
  default: "~/datasets/sa-v/sav_train"
