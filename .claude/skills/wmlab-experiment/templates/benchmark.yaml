# ─────────────────────────────────────────────────────────────────────────────────────────────
# GABARIT de benchmark Watermark Lab (ARCHITECTURE.md §5.5) — exemple image v2 sur DIV2K.
# À copier dans benchmarks/<modalité>_v<N>.yaml. Un benchmark publié est FIGÉ : ne jamais le
# modifier ensuite (les résultats ne seraient plus comparables) ; créer la version suivante.
#
# Règles : données fixes et déterministes (seed, pas de prétraitement aléatoire, `limit`),
# attaques évaluées à strength = 1 avec des labels explicites et uniques (sévérité dans le
# label : jpeg_q50, crop_50…), une entrée `identity` (label none) comme référence.
#
# Vérifier : .venv/bin/python -m wmlab.cli validate benchmarks/<nom>.yaml
# Évaluer  : .venv/bin/python -m wmlab.cli eval --run <run_id> --checkpoint last --benchmark <nom> --smoke
# ─────────────────────────────────────────────────────────────────────────────────────────────
name: image_v2                       # = nom du fichier
version: 2
modality: image
description: "Suite image v2 — DIV2K validation, 256 px centrés — ne jamais modifier : créer image_v3"

data:
  dataset: image_folder
  params: {root: "@div2k_valid"}     # catalogue datasets/div2k_valid.yaml (jamais de chemin absolu)
  preprocess:
    - {name: resize, params: {size: 256}}         # déterministe
    - {name: center_crop, params: {size: 256}}    # déterministe
  limit: 100

batch_size: 16
seed: 0                              # graine des messages et des attaques aléatoires
quality_metrics: [psnr, ssim]
fpr: [1.0e-2, 1.0e-4, 1.0e-6]

attacks:
  - {label: none, name: identity}
  - {label: jpeg_q50, name: jpeg, params: {quality: 50}}
  - {label: jpeg_q80, name: jpeg, params: {quality: 80}}
  - {label: blur_s2, name: gaussian_blur, params: {sigma: 2.0}}
  - {label: noise_006, name: gaussian_noise, params: {std: 0.06}}
  - {label: crop_50, name: crop, params: {area: 0.5}}
  - {label: resize_50, name: resize, params: {scale: 0.5}}
  - {label: rotate_10, name: rotate, params: {degrees: 10}}
  - {label: brightness_03, name: brightness, params: {delta: 0.3}}
  - {label: contrast_05, name: contrast, params: {factor: 0.5}}
  - {label: saturation_05, name: saturation, params: {factor: 0.5}}
  - label: combo_jpeg_crop
    name: combo
    params: {attacks: [{name: crop, params: {area: 0.5}}, {name: jpeg, params: {quality: 50}}]}
